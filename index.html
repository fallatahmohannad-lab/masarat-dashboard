<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masarat Al-Tanfeeth — Executive Dashboard v10.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F6F9;--bg2:#EAF1F4;--card:#FFFFFF;--ink:#0F2027;--teal:#00839E;--accent:#00B4DB;
    --accent2:#16C79A;--muted:#5A6F78;--line:#E2E9ED;--pos:#1B9E6E;--neg:#D9534F;
    --shadow:0 2px 10px rgba(15,32,39,.06);--font:'Segoe UI',Tahoma,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);min-height:100vh;
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;padding:26px 20px 60px}
  .wrap{max-width:1180px;margin:0 auto}
  header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:16px}
  .brand h1{font-size:22px;font-weight:700}
  .brand .ar{color:var(--teal);font-size:14px;margin-top:3px}
  .brand p{color:var(--muted);font-size:12px;margin-top:6px}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .langbtn{cursor:pointer;border:1px solid var(--accent);background:var(--card);color:var(--teal);
    font-family:var(--font);font-weight:700;font-size:13px;padding:7px 16px;border-radius:20px;transition:.2s}
  .langbtn:hover{background:var(--accent);color:#fff}
  .ver{font-size:11px;color:var(--muted);border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;white-space:nowrap}
  .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:14px 0 22px}
  .tabs button{cursor:pointer;border:none;background:none;color:var(--muted);font-family:var(--font);
    font-size:14.5px;font-weight:700;padding:12px 18px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{color:var(--teal);border-bottom-color:var(--accent)}
  .page{display:none}.page.active{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .storybeat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:10px;padding:14px 17px;font-size:13px;line-height:1.6;margin-bottom:18px;box-shadow:var(--shadow)}
  .storybeat b{color:var(--teal)}
  .insights{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .insight{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.55;color:var(--ink)}
  .insight a{color:var(--accent);font-weight:700;text-decoration:none;font-size:11.5px}
  .insight a:hover{text-decoration:underline}
  .universe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .universe button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:8px 15px;border-radius:9px;font-size:12.5px;font-weight:600;transition:.2s;font-family:var(--font)}
  .universe button:hover{color:var(--ink);border-color:var(--accent)}
  .universe button.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:26px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;height:100%;width:3px;background:linear-gradient(var(--accent),var(--accent2))}
  .kpi .lbl{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:23px;font-weight:700;margin:6px 0 4px}
  .kpi .val.pos{color:var(--pos)}
  .kpi .sub{font-size:11.5px;color:var(--muted);line-height:1.45}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 18px 14px;box-shadow:var(--shadow)}
  .panel.full{grid-column:1/-1}
  .panel h3{font-size:14px;font-weight:700}
  .panel .beat{font-size:11.5px;color:var(--muted);margin:3px 0 14px;font-style:italic}
  .cwrap{position:relative;height:300px}.cwrap.tall{height:330px}
  table.pnl{width:100%;border-collapse:collapse;font-size:12px}
  table.pnl th,table.pnl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
  table.pnl th:first-child,table.pnl td:first-child{text-align:left;color:var(--ink)}
  table.pnl thead th{background:var(--bg2);color:var(--teal);font-weight:700}
  table.pnl tr.tot td{font-weight:700;color:var(--ink);background:#F7FAFB}
  table.pnl tr.eb td{font-weight:700;color:var(--pos)}
  table.pnl td.posnum{color:var(--pos);font-weight:700}
  table.pnl td.neg{color:var(--neg);font-weight:700}
  table.pnl tr.ebrow td:first-child{color:var(--ink);font-weight:700}
  table.pnl td.cost{color:#7d6b55}
  footer{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px;line-height:1.6}
  footer b{color:var(--ink)}
  .methnote{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
  .methnote .mh{color:var(--teal);font-weight:700;font-size:12.5px;margin-bottom:6px}
  .methnote .mb{font-size:12px;line-height:1.6;color:var(--ink);text-align:justify}
  .methnote .mf{background:var(--bg2);border-radius:6px;padding:8px 10px;font-weight:600;margin:6px 0}
  .infobtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--accent);color:var(--teal);font-size:11px;font-weight:700;cursor:pointer;margin-inline-start:6px;background:var(--card);font-family:var(--font);line-height:1;flex:none;font-style:italic}
  .infobtn:hover{background:var(--accent);color:#fff}
  .infobox{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:11.5px;line-height:1.6;color:var(--ink);text-align:justify;display:none}
  /* RTL */
  html[dir=rtl] body{direction:rtl}
  html[dir=rtl] .topright{align-items:flex-start}
  html[dir=rtl] .kpi::before{left:auto;right:0}
  html[dir=rtl] .storybeat{border-left:1px solid var(--line);border-right:4px solid var(--accent)}
  html[dir=rtl] table.pnl th,html[dir=rtl] table.pnl td{text-align:left}
  html[dir=rtl] table.pnl th:first-child,html[dir=rtl] table.pnl td:first-child{text-align:right}
  @media(max-width:760px){.grid,.insights{grid-template-columns:1fr}.brand h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">Masarat Al-Tanfeeth — Executive Dashboard</h1>

  <nav class="tabs" id="tabs">

    <div class="universe" id="universe">

      <div class="panel"><h3 data-i18n="c_conc_t"></h3><div class="beat" data-i18n="c_conc_b"></div><div class="cwrap"><canvas id="concChart"></canvas></div></div>
      <div class="panel"><div style="display:flex;align-items:center;flex-wrap:wrap"><h3 data-i18n="c_leak_t"></h3><button class="infobtn" onclick="toggleInfo('info_leak22')">i</button></div><div class="infobox" id="info_leak22" data-i18n="info_leak22"></div><div class="beat" data-i18n="c_leak_b"></div><div class="cwrap"><canvas id="leakChart"></canvas></div></div>

  <!-- ===== Governance Gap ===== -->
  <section class="page" id="p99">

    <div class="insights">
      <div class="insight"><span data-i18n="ins99a"></span> <a href="https://mof.gov.sa/" target="_blank" rel="noopener" data-i18n="src">Source ↗</a></div>
      <div class="insight"><span data-i18n="ins99b"></span> <a href="https://expro.gov.sa/" target="_blank" rel="noopener" data-i18n="src">Source ↗</a></div>

    <div class="grid">
      <div class="panel"><h3 data-i18n="c_leak99_t"></h3><div class="beat" data-i18n="c_leak99_b"></div><div class="cwrap"><canvas id="leak99Chart"></canvas></div></div>
      <div class="panel"><div style="display:flex;align-items:center;flex-wrap:wrap"><h3 data-i18n="t_leak99_t"></h3><button class="infobtn" onclick="toggleInfo('info_leak99')">i</button></div><div class="infobox" id="info_leak99" data-i18n="info_leak99"></div><div class="beat" data-i18n="t_leak99_b"></div><div id="leak99Table"></div></div>

  <!-- ===== §6.3 ===== -->
  <section class="page" id="p63">
    <div class="storybeat" data-i18n="beat63"></div>

    <div class="grid">
      <div class="panel full"><div style="display:flex;align-items:center;flex-wrap:wrap"><h3 data-i18n="c_pnl_t"></h3><button class="infobtn" onclick="toggleInfo('info_pnl63')">i</button></div><div class="infobox" id="info_pnl63" data-i18n="info_pnl63"></div><div class="beat" data-i18n="c_pnl_b"></div><div class="cwrap tall"><canvas id="pnlChart"></canvas></div></div>
      <div class="panel full"><h3 data-i18n="t_pnl_t"></h3><div class="beat" data-i18n="t_pnl_b"></div><div id="pnlTable"></div></div>
      <div class="panel"><h3 data-i18n="c_opex_t"></h3><div class="beat" data-i18n="c_opex_b"></div><div class="cwrap"><canvas id="opexChart"></canvas></div></div>
      <div class="panel"><h3 data-i18n="c_prof_t"></h3><div class="beat" data-i18n="c_prof_b"></div><div class="cwrap"><canvas id="profChart"></canvas></div></div>

    <div class="grid">

      <div class="panel"><h3 data-i18n="c_bottle77_t"></h3><div class="beat" data-i18n="c_bottle77_b"></div><div class="cwrap"><canvas id="bottle77Chart"></canvas></div></div>

      <div class="panel"><h3 data-i18n="c_lag77_t"></h3><div class="beat" data-i18n="c_lag77_b"></div><div class="cwrap"><canvas id="lag77Chart"></canvas></div></div>

</div>

<script>
/* ===================== i18n DICTIONARY ===================== */
const L={
 en:{
  title:"Masarat Al-Tanfeeth — Executive Dashboard",
  cycle:"The Pre-Award Planning to Post-Award Payment Cycle",
  tagline:"Two-Phase Multi-Sided GovTech & FinTech Marketplace · Vision 2030 · v10.0",
  lang:"العربية", tab22:"Market Dynamics", tab63:"Financial Feasibility", tab99:"The Governance Gap",
  beat22:"This is not a SAR 429B construction play. It is a SAR 1.65T multi-sided market whose value is concentrated in a handful of large tenders, locked in by local-content regulation, and trapped behind a 65-day payment lag. Masarat is built to release exactly that trapped value.",
  beat63:"<b>For the CFO —</b> the dynamic Approval Matrix freezes every change order until the technical study clears it, and the Movement Reversal engine writes down any returned or rejected value the instant it happens. Together they eliminate over-factoring risk and convert a 65-day payment lag into financeable, low-risk working capital — at a Year-3 EBITDA margin of +28.3% on a deliberately lean SAR 14.2M cost base.",
  ins1:"Etimad has processed over <b>SAR 2 Trillion</b> in government contracts since launch — the national rail Masarat governs.",
  ins2:"GASTAT anchors the construction sector at <b>SAR 429.3B</b> — SMEs SAR 248.9B, large enterprises SAR 180.4B — the empirical basis for our bimodal design.",
  src:"Source ↗",
  leg:"● Green = positive · <span style='color:#D9534F'>Red = negative</span> (shown in parentheses). COGS and OpEx are costs deducted from revenue, not negative results.",
  uB2g:"Phase 1 — B2G Universe", uB2b:"Phase 2 — B2B Universe", uCmb:"Combined Trajectory",
  c_pipe_t:"SAR 460B B2G Pipeline — by Category", c_pipe_b:"Distribution → bars: construction is the beachhead, not the ceiling (60% non-construction).",
  c_ent_t:"Bimodal Entity-Size Economy", c_ent_b:"Composition: two comparable economies, opposite maturities → bimodality is architectural.",
  c_conc_t:"Value Concentration — 2024 Etimad Tenders", c_conc_b:"1.6% of tenders by count carry 69.5% of value — a top-down enterprise sales motion.",
  c_leak_t:"Value-Leakage Composition", c_leak_b:"~69% of leakage in change orders + payment delay — Masarat's primary value pools.",
  c_trend_t:"Tender Acceleration & 2025 Predictive Horizon", c_trend_b:"The Etimad pipeline scales natively in SAR Billions, crossing the frozen SAR 460B SAM barrier by 2025 (2024–2025 = forecast).",
  trendValLbl:"Pipeline Value (SAR B)", trendCntLbl:"Tender Count", trendAxisL:"SAR Billions (مليار ريال سعودي)", trendAxisR:"Tender Count",
  foot3:"<b>Tender trend:</b> The Tender Trend chart tracks the macro expansion of the Etimad pipeline, demonstrating how tracked transaction volume natively scales up to cross our frozen SAR 460 Billion SAM barrier by 2025. This total addressable pipeline fuels Masarat's multi-sided commercial model, driving our targeted Year-3 EBITDA of SAR 19.8M (on SAR 70.0M revenue) against our compressed SAR 14.2M OpEx base.",
  c_pnl_t:"3-Year P&L Trajectory — Revenue, OpEx & EBITDA", c_pnl_b:"Revenue (line) outpaces a flat OpEx curve; EBITDA turns positive in Year 2 and reaches +28.3% by Year 3.",
  t_pnl_t:"Exact Multi-Year P&L — Line Items (SAR M)", t_pnl_b:"SaaS subscriptions + FinTech factoring commissions, against five disciplined OpEx lines.",
  c_opex_t:"Year-3 Cost Structure — SAR 14.2M", c_opex_b:"Five OpEx lines; Personnel & Core AI Engineering dominate, compounding into reusable IP.",
  c_prof_t:"Multi-Year OpEx Profile (stacked)", c_prof_b:"OpEx scales only behind validated revenue — 1.40M → 4.60M → 14.20M.",
  c_rev_t:"Revenue Streams (stacked) — SaaS vs FinTech", c_rev_b:"SaaS subscriptions plus FinTech marketplace factoring commissions.",
  c_mvp_t:"Ultra-Lean MVP Inception — SAR 450K", c_mvp_b:"66.7% of capital builds permanent backend IP before scale capital is deployed.",
  foot1:"<b>Sources & caveats:</b> GASTAT Comprehensive Economic Survey 2023 (SAR 429.3B; SME 248.9B / Large 180.4B); Etimad > SAR 2T processed contracts; LCGPA 2024 (SAR 336.3B tenders, 94.1% local-content intensity). SAR 460B+ category splits are calibrated analyst allocations.",
  foot2:"<b>EBITDA bridge:</b> Year-3 EBITDA +28.3% (SAR 19.8M) = Revenue 70.0M − Cost of Revenue 36.0M − OpEx 14.2M. Cost of Revenue covers financier factoring payouts, cloud/Claude-API consumption and onboarding. Unit economics are analyst-derived for illustration.",
  // Governance Gap (§p99)
  beat99:"<b>The fact that justifies the build —</b> Etimad processes over SAR 2 Trillion, yet no official body publishes a national figure for rejected bids, contract fines, or currently-stalled projects. This is not a research gap — it is an institutional governance gap: the system disburses but does not measure execution. Masarat is the missing measurement layer.",
  ins99a:"The Government Tenders &amp; Procurement Law (Art. 72) caps delay penalties at 6% of supply contracts and 20% of works contracts — yet no national total of imposed fines is published.",
  ins99b:"Expro (Spending Efficiency Authority) cut project stumbling in Madinah from 46% (2020) to under 1% (2024) — proof that digital governance moves the needle.",
  c_expro_t:"Proof of Impact — The Expro Madinah Model",
  c_expro_b:"Madinah region, 2020 → 2024 — project stumbling collapsed from 46% to under 1% once spending-governance discipline was applied.",
  expro_note:"The stumbling rate fell across the Madinah region between 2020 and 2024 through spending-governance practices applied by Expro. Masarat generalises this proven model from a single region to the entire national execution system.",
  c_leak99_t:"Value-Leakage Anchored to Statute",
  c_leak99_b:"Each leakage pool mapped to the article of law that governs it.",
  t_leak99_t:"Leakage Pools × Legal Anchor",
  t_leak99_b:"Percentages are calibrated analyst estimates; each legal anchor is documented in statute.",
  t_rej_t:"Statutory Bid-Rejection Taxonomy — The Product",
  t_rej_b:"Seven codified disqualification grounds become the platform's ready-made rejection taxonomy.",
  trapNote22:"<div class='mh'>📊 Deriving the Trapped Working-Capital Figure (SAR 29.4B):<button class='infobtn' onclick=\"toggleInfo('info_trap22')\">i</button></div><div class='mb'>This anchor figure is derived from a financial model linking the sector's annual operating expense to the average liquidity-lag period. Applied formula: <div class='mf'>Trapped Capital = (Annual Sector OpEx ÷ 365) × Average Payment Lag</div> Using an estimated operating-expense base of SAR 165.2B (calibrated against GASTAT data — not a figure published directly by GASTAT) and a 65-day average field-to-cash lag: (165.2 ÷ 365) × 65 ≈ SAR 29.4B in trapped working capital. This base is the quantitative reference underlying the value-leakage analysis in the Governance Gap tab.</div>",
  trapNote99:"<div class='mh'>📊 From Macro Base to Distribution — Method &amp; Statutory Anchoring:</div><div class='mb'>The amounts start from the SAR 29.4B trapped-capital base, derived via <div class='mf'>(165.2B ÷ 365) × 65 days</div> (OpEx base calibrated against GASTAT; 65-day lag). This total is distributed by the calibrated estimated leakage shares into: SAR 11.17B change orders (Art. 69 — amendments), SAR 9.11B payment-delay carrying cost (Art. 72 — delay penalties), SAR 5.29B manual reconciliations (Art. 73 — continuous-execution contracts), SAR 2.65B local-content penalties (LCGPA Mandatory List), and SAR 1.18B other administrative items. The percentages are estimates and the base is derived from platform data; no official figure for leakage distribution is published — precisely the governance gap Masarat addresses through its Movement &amp; Reversal Engine.</div>",
  info_leak22:"Methodology: The 38/31/18/9/4 distribution is constructed using the Tawazun/PwC 5-step Spend-Analysis method (Spend Pareto). The rank order follows documented pain severity from this research: change orders represent 15–30% of contract value in Saudi mega-projects (Problem Statement); payment-delay carrying cost rests on the documented 60–70-day field-to-cash lag against the sector's SAR 165.2B annual OpEx; reconciliation reflects the 15–30 working-day manual claim cycle and the surveyed #1 bottleneck (quantity matching); LCGPA penalties reflect score-shock exposure including up to 10% price-preference disqualification. Exact percentages are calibrated analyst estimates — no official leakage distribution is published.",
  info_pipe22:"Methodology: The SAR 460B serviceable pipeline is conservatively scoped from official macro anchors — Etimad annual procurement exceeding SAR 500B (trade.gov) and SAR 336.3B in 2024 tenders (LCGPA). The six-category split (Construction 185 / O&amp;M 80 / Medical 70 / Goods 55 / IT 45 / Professional 25) is a calibrated analyst allocation aligning Etimad activity categories with FY2026 budget allocations (e.g., SAR 260B healthcare, ~SAR 201B education, MoF). Category boundaries are estimates; the total envelope is anchored to official figures.",
  info_trap22:"Methodology: Trapped Capital = (Annual Sector OpEx ÷ 365) × Average Payment Lag = (165.2B ÷ 365) × 65 ≈ SAR 29.4B. The 165.2B OpEx base is an estimated figure calibrated against GASTAT's 2023 survey (which reports SAR 429.3B sector operating revenue — OpEx is derived, not published). The 65-day lag sits inside the documented 60–70-day range. This formula is declared as an explicit assumption in the capstone report (§6.2: 'Opex × 65/365-day outstanding (assumption)') — the dashboard and the report are fully consistent.",
  info_leak99:"Methodology: SAR amounts = pool share × the SAR 29.4B trapped-capital base (e.g., 38% × 29.4 = 11.17B). Shares follow the Tawazun Spend-Pareto construction (see Market Dynamics ⓘ); the base derivation is (165.2B ÷ 365) × 65 days. Legal anchors are statutory and verified: Art. 69 (amendments), Art. 72 (delay penalties), Art. 73 (continuous-execution contracts), LCGPA Mandatory List. No official national figure exists for either rejected bids, imposed fines, or leakage distribution — this absence is the governance gap itself.",
  info_pnl63:"Methodology: All P&amp;L figures (revenue 6.8→24.0→70.0M, OpEx 1.40→4.60→14.20M, Year-3 EBITDA +28.3%) are analyst-derived unit economics built bottom-up for illustration: tiered SaaS subscriptions plus a 0.5–1.5% FinTech origination commission applied to a Year-3 SOM of ≈SAR 880M (3% of the 29.4B locked pool), midpoint 1% ≈ SAR 8.8M origination revenue — consistent with the capstone's FinTech market-sizing model (§6.2). These are forward-looking estimates, not audited figures.",

  lang:"English", tab22:"ديناميكيات السوق", tab63:"الجدوى المالية", tab99:"فجوة الحوكمة",
  beat22:"هذه ليست فرصة إنشاءات بقيمة 429 مليار ريال، بل سوقٌ متعدد الأطراف بقيمة 1.65 تريليون ريال، قيمته مركّزة في عددٍ محدود من المنافسات الكبرى، ومحميّة باشتراطات المحتوى المحلي، ومحتجزة خلف فجوة سدادٍ تمتد 65 يوماً. صُمّمت مسارات لتحرير هذه القيمة المحتجزة بالتحديد.",
  beat63:"<b>إلى المدير المالي —</b> مصفوفة الاعتماد الديناميكية تُجمّد أي أمر تغييرٍ حتى تُجيزه الدراسة الفنية، ومحرّك عكس الحركة يُخفّض أي قيمةٍ مرتجعة أو مرفوضة لحظة حدوثها. ومعاً يُلغيان مخاطر التمويل الزائد ويحوّلان فجوة سدادٍ من 65 يوماً إلى رأس مالٍ عامل منخفض المخاطر وقابل للتمويل — بهامش EBITDA يبلغ +28.3% في السنة الثالثة على قاعدة تكلفةٍ رشيقة قدرها 14.2 مليون ريال.",
  ins1:"عالجت منصة اعتماد أكثر من <b>2 تريليون ريال</b> من العقود الحكومية منذ إطلاقها — وهي القناة الوطنية التي تحوكمها مسارات.",
  ins2:"تُثبّت هيئة الإحصاء حجم قطاع الإنشاءات عند <b>429.3 مليار ريال</b> — المنشآت الصغيرة والمتوسطة 248.9 مليار والكبرى 180.4 مليار — وهو الأساس التجريبي لتصميمنا الثنائي.",

  c_trend_t:"تسارع المنافسات وأفق التنبؤ 2025", c_trend_b:"خط مشتريات اعتماد يتوسّع بالمليار، ويتقاطع مع حاجز السوق المعتمد 460 مليار ريال بحلول 2025 (2024–2025 تنبؤ).",
  trendValLbl:"قيمة الخط (مليار ريال)", trendCntLbl:"عدد المنافسات", trendAxisL:"مليار ريال سعودي", trendAxisR:"عدد المنافسات",
  foot3:"<b>تسارع المشتريات:</b> شارت تسارع المشتريات يرصد التوسّع الكلي لعمليات منصة اعتماد حتى يتقاطع مع حجم السوق الفعلي المعتمد في التقرير وهو 460 مليار ريال بحلول عام 2025. هذا الخط الضخم هو النواة التي تغذّي نموذج مسارات التجاري لتوليد EBITDA السنة الثالثة البالغ 19.8 مليون ريال (على إيراد 70.0 مليون) وتغطية مصروفاتنا المحوكمة البالغة 14.2 مليون ريال دون أي تعارض رقمي.",

  c_opex_t:"هيكل تكلفة السنة الثالثة — 14.2 مليون ريال", c_opex_b:"خمسة بنود مصروفات؛ الرواتب وهندسة الذكاء الاصطناعي تهيمن وتتراكم كملكية فكرية قابلة لإعادة الاستخدام.",
  c_prof_t:"ملف المصروفات متعدد السنوات (تراكمي)", c_prof_b:"المصروفات تتوسّع فقط خلف إيرادٍ مُتحقّق — 1.40 ← 4.60 ← 14.20 مليون.",
  c_rev_t:"مصادر الإيراد (تراكمي) — SaaS مقابل التمويل", c_rev_b:"اشتراكات SaaS إضافةً إلى عمولات تخصيم سوق التمويل.",
  c_mvp_t:"تأسيس MVP فائق الرشاقة — 450 ألف ريال", c_mvp_b:"66.7% من رأس المال تبني ملكية فكرية خلفية دائمة قبل ضخّ رأس مال التوسّع.",
  foot1:"<b>المصادر والتحفظات:</b> مسح هيئة الإحصاء الاقتصادي الشامل 2023 (429.3 مليار؛ صغيرة 248.9 / كبيرة 180.4)؛ اعتماد > 2 تريليون عقد معالَج؛ هيئة المحتوى المحلي 2024 (336.3 مليار منافسة، كثافة محتوى محلي 94.1%). تقسيمات الـ 460 مليار تقديرات تحليلية معايَرة.",
  foot2:"<b>جسر EBITDA:</b> السنة الثالثة +28.3% (19.8 مليون) = إيراد 70.0 − تكلفة إيراد 36.0 − مصروفات 14.2 مليون. تكلفة الإيراد تشمل مدفوعات التخصيم للممولين واستهلاك السحابة/واجهة Claude والتهيئة. وحدات الاقتصاد تقديرية للتوضيح.",
  // فجوة الحوكمة (§p99)
  beat99:"<b>الحقيقة التي تبرّر المشروع —</b> تعالج منظومة اعتماد أكثر من 2 تريليون ريال، ومع ذلك لا تنشر أي جهة رسمية رقماً وطنياً مجمّعاً للعروض المرفوضة، ولا للغرامات المفروضة على العقود، ولا للمشاريع المتعثرة حالياً. هذه ليست ثغرة بحثية، بل فجوة حوكمة مؤسسية: المنظومة تصرف ولا تقيس أثر التنفيذ. مسارات صُمّمت لتكون طبقة القياس المفقودة.",
  ins99a:"يحدّد نظام المنافسات والمشتريات الحكومية (م.72) سقف غرامة التأخير بـ6% لعقود التوريد و20% لعقود الأعمال — ومع ذلك لا يُنشر إجمالي وطني للغرامات المفروضة.",
  ins99b:"خفّضت هيئة كفاءة الإنفاق والمشروعات الحكومية (إكسبرو) تعثّر المشاريع في المدينة المنورة من 46% (2020) إلى أقل من 1% (2024) — دليلٌ على أثر الحوكمة الرقمية.",
  c_expro_t:"دليل الأثر — نموذج إكسبرو بالمدينة المنورة",
  c_expro_b:"منطقة المدينة المنورة، 2020 ← 2024 — انهار تعثّر المشاريع من 46% إلى أقل من 1% بعد تطبيق انضباط حوكمة الإنفاق.",

  t_leak99_t:"مجمّعات التسرّب × السند النظامي",
  t_leak99_b:"النسب تقديرات تحليلية معايَرة؛ وكل سند نظامي موثّق في الأنظمة.",
  t_rej_t:"تصنيف أسباب الرفض النظامي — المنتج",
  t_rej_b:"سبعة أسباب استبعاد مقنّنة تتحوّل إلى تصنيف الرفض الجاهز للمنصة.",
  trapNote22:"<div class='mh'>📊 اشتقاق رقم رأس المال العامل المحتجز (29.4 مليار ريال):<button class='infobtn' onclick=\"toggleInfo('info_trap22')\">i</button></div><div class='mb'>يُشتقّ هذا الرقم المحوري من نموذج مالي يربط النفقات التشغيلية السنوية للقطاع بمتوسط فترة تعليق السيولة. المعادلة المطبّقة: <div class='mf'>رأس المال المحتجز = (النفقات التشغيلية السنوية ÷ 365) × متوسط فترة تأخّر الصرف</div> وبتطبيق قاعدة مصروفات تشغيلية مقدّرة قدرها 165.2 مليار ريال (معايَرة على بيانات الهيئة العامة للإحصاء GASTAT، وليست رقماً منشوراً مباشرةً عنها)، ومتوسط تأخّر تحويل المستخلصات إلى نقد قدره 65 يوماً: (165.2 ÷ 365) × 65 ≈ 29.4 مليار ريال محتجزة كسيولة عالقة. هذه القاعدة هي المرجع الكمّي الذي يُبنى عليه تحليل تسرّب القيمة في تبويب فجوة الحوكمة.</div>",
  trapNote99:"<div class='mh'>📊 من القاعدة الكلية إلى التوزيع — المنهجية والإسناد النظامي:</div><div class='mb'>تنطلق المبالغ من قاعدة رأس المال المحتجز 29.4 مليار ريال، المشتقّة عبر: <div class='mf'>(165.2 مليار ÷ 365) × 65 يوماً</div> (قاعدة المصروفات معايَرة على GASTAT، والفجوة 65 يوماً). ويُوزَّع هذا الإجمالي وفق نسب التسرّب التقديرية المعايَرة إلى: 11.17 مليار أوامر تغيير (م.69 — التعديلات)، 9.11 مليار أعباء تأخّر السداد (م.72 — غرامات التأخير)، 5.29 مليار تسويات يدوية (م.73 — العقود مستمرة التنفيذ)، 2.65 مليار غرامات محتوى محلي (القائمة الإلزامية LCGPA)، و1.18 مليار بنود إدارية أخرى. النسب تقديرية والقاعدة مشتقّة من بيانات المنصة؛ ولا يُنشر رقم رسمي لتوزيع التسرّب — وهذه فجوة الحوكمة ذاتها التي تعالجها مسارات عبر محرك الحركة والعكس.</div>",
  info_leak22:"المنهجية: وُزِّعت النسب 38/31/18/9/4 وفق منهجية تحليل الإنفاق الخماسية (Tawazun/PwC — Spend Pareto). ترتيب النسب يتبع شدة الألم الموثّقة في هذا البحث: أوامر التغيير تمثل 15–30% من قيمة العقد في المشاريع الكبرى (بيان المشكلة)؛ وعبء تأخّر السداد يستند إلى فجوة 60–70 يوماً الموثّقة لتحويل المستخلص إلى نقد مقابل مصروفات تشغيلية قطاعية قدرها 165.2 مليار ريال سنوياً؛ والتسويات تعكس دورة المطالبة اليدوية 15–30 يوم عمل وعنق الزجاجة الأول في الاستبيان (مطابقة الكميات)؛ وغرامات المحتوى المحلي تعكس مخاطر صدمة النقاط وحرمان الأفضلية السعرية حتى 10%. النسب الدقيقة تقديرات تحليلية معايَرة — لا يُنشر توزيع رسمي للتسرّب.",

function applyText(){
  const t=L[lang];
  document.documentElement.lang=lang;
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  document.getElementById('langBtn').textContent=t.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{

  });

function renderTable(){
  const t=L[lang].tbl, y=L[lang].years;
  const row=(label,vals,cls='')=>`<tr class="${cls}"><td>${label}</td>${vals.map(v=>`<td>${v.toFixed(1)}</td>`).join('')}</tr>`;
  const marg=D.ebit.map((e,i)=>(e/D.rev[i]*100));
  let html=`<table class="pnl"><thead><tr><th>${t.rev}</th><th>${y[0]}</th><th>${y[1]}</th><th>${y[2]}</th></tr></thead><tbody>`;
  html+=row(t.saas,D.saas)+row(t.fin,D.fin)+row(t.totrev,D.rev,'tot');
  html+=row(t.cogs,D.cogs);
  const rowP=(label,vals,cls='')=>`<tr class="${cls}"><td>${label}</td>${vals.map(v=>`<td class="cost">(${v.toFixed(1)})</td>`).join('')}</tr>`;
  L[lang].opexCat.forEach((c,i)=>{html+=rowP(c,D.opexCat[i]);});
  html+=rowP(t.totopex,D.opexTot,'tot');
  const sgn=v=>v<0?'neg':'posnum';
  html+=`<tr class="ebrow"><td>${t.ebit}</td>${D.ebit.map(v=>`<td class="${sgn(v)}">${v<0?'('+Math.abs(v).toFixed(1)+')':v.toFixed(1)}</td>`).join('')}</tr>`;
  html+=`<tr class="ebrow"><td>${t.margin}</td>${marg.map(m=>`<td class="${sgn(m)}">${m<0?'('+Math.abs(m).toFixed(1)+'%)':m.toFixed(1)+'%'}</td>`).join('')}</tr>`;
  html+=`</tbody></table>`;
  html+=`<div style="font-size:11px;color:var(--muted);margin-top:8px">${L[lang].leg}</div>`;
  document.getElementById('pnlTable').innerHTML=html;
}

const buildFns={p22:buildP22,p63:buildP63,p99:buildP99,p77:buildP77};
function ensurePage(p){
  if(builtLang[p]!==lang){buildFns[p](); builtLang[p]=lang;}
  else setTimeout(()=>store[p].forEach(c=>c.resize()),40);
}

/* ===================== EVENTS ===================== */
document.getElementById('langBtn').addEventListener('click',()=>{
  lang = lang==='en'?'ar':'en';
  applyText(); renderKPIs(); renderTable();
  builtLang.p22=null; builtLang.p63=null; builtLang.p99=null; builtLang.p77=null;
  ensurePage(activePage);
});
document.getElementById('universe').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#universe button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active'); activeUniverse=e.target.dataset.u; renderKPIs();
});
document.getElementById('tabs').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  e.target.classList.add('active'); activePage=e.target.dataset.p;
  document.getElementById(activePage).classList.add('active'); ensurePage(activePage);
});

/* ===================== INIT ===================== */
applyText(); renderKPIs(); renderTable(); ensurePage('p22');
</script>
